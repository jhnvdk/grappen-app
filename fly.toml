# Fly.io config voor Grappenscore
# Wijzig 'app' als de naam al bezet is.
app = "grappenscore"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DATA_FILE = "/data/data.json"

[http_service]
  internal_port = 3000
  force_https = true
  # Altijd één machine aan laten: de stand staat in het geheugen
  # en telefoons houden een WebSocket open.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "grappen_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
